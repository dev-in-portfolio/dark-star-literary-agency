name: One-time Media Inventory

on:
  push:
    branches:
      - "agent/site-hardening-and-catalog-fixes"

permissions:
  contents: write

jobs:
  generate-media-inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/site-hardening-and-catalog-fixes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate inventory
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_media_inventory.py
          python scripts/update_media_inventory.py --write

      - name: Commit inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media-inventory.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record public media inventory"
          git push origin HEAD:agent/site-hardening-and-catalog-fixes
