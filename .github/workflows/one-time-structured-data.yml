name: One-time Structured Data Update

on:
  push:
    branches:
      - "agent/site-hardening-and-catalog-fixes"

permissions:
  contents: write

jobs:
  update-structured-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/site-hardening-and-catalog-fixes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate structured data
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_structured_data.py
          python scripts/update_structured_data.py --write

      - name: Commit generated structured data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html books/*.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: refresh organization and book structured data"
          git push origin HEAD:agent/site-hardening-and-catalog-fixes
