name: One-time Structured Data Update

on:
  push:
    branches:
      - "agent/site-hardening-and-catalog-fixes"

permissions:
  contents: write

jobs:
  update-structured-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/site-hardening-and-catalog-fixes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove unsupported founder relationship
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/update_structured_data.py")
          text = path.read_text(encoding="utf-8")
          old = '''                "email": email,
                "founder": {"@id": f"{site_url}/#author"},
'''
          new = '''                "email": email,
'''
          if old not in text:
              raise SystemExit("Expected founder relationship was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Generate structured data
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_structured_data.py
          python scripts/update_structured_data.py --write

      - name: Commit generated structured data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_structured_data.py index.html books/*.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep structured identity claims source-backed"
          git push origin HEAD:agent/site-hardening-and-catalog-fixes
