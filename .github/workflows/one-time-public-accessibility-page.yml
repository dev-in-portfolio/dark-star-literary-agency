name: One-time Public Accessibility Page

on:
  push:
    branches:
      - "agent/site-hardening-and-catalog-fixes"

permissions:
  contents: write

jobs:
  publish-accessibility-page:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/site-hardening-and-catalog-fixes

      - name: Link accessibility statement from Contact
        shell: python
        run: |
          from pathlib import Path

          path = Path('contact.html')
          text = path.read_text(encoding='utf-8')
          marker = '''            <article class="contact-card">
              <h3>General Inquiries</h3>
              <p>Anything else you would like to share with the studio.</p>
            </article>'''
          replacement = '''            <article class="contact-card">
              <h3>Accessibility Feedback</h3>
              <p>Report a barrier, request an accessible alternative, or read the current <a href="accessibility.html">accessibility statement</a>.</p>
            </article>
            <article class="contact-card">
              <h3>General Inquiries</h3>
              <p>Anything else you would like to share with the studio.</p>
            </article>'''
          if marker not in text:
              raise SystemExit('Expected Contact page insertion point was not found')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

      - name: Generate canonical metadata and sitemap
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_seo.py
          python scripts/update_seo.py --write
          python scripts/update_seo.py --check

      - name: Commit public accessibility page
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accessibility.html contact.html sitemap.xml robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish accessibility statement"
          git push origin HEAD:agent/site-hardening-and-catalog-fixes
