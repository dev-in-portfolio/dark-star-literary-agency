name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation script
        run: python -m py_compile scripts/validate_site.py

      - name: Validate HTML, links, metadata, and media
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_site.py | tee validation-report.txt

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-validation-report
          path: validation-report.txt
          if-no-files-found: warn
