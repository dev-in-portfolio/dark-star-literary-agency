name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation script
        run: python -m py_compile scripts/validate_site.py

      - name: Validate HTML, links, metadata, and media
        run: python scripts/validate_site.py
