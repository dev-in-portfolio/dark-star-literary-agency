name: One-time Accessibility Documentation Patch

on:
  push:
    branches:
      - "agent/site-hardening-and-catalog-fixes"

permissions:
  contents: write

jobs:
  patch-accessibility-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/site-hardening-and-catalog-fixes

      - name: Patch README and source inventory
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          replacements = [
              (
                  'python scripts/update_media_inventory.py --check\n```',
                  'python scripts/update_media_inventory.py --check\npython scripts/validate_pdf_accessibility.py\n```'
              ),
              (
                  '- Exact media paths, sizes, checksums, aggregate budgets, per-file budgets, and deferred-delivery behavior\n',
                  '- Exact media paths, sizes, checksums, aggregate budgets, per-file budgets, and deferred-delivery behavior\n- Exact reconciliation of all 44 PDF accessibility records with source filenames, page counts, and SHA-256 values\n- Prevention of public PDF links and accessible-edition claims until remediation is approved\n'
              ),
              (
                  'GitHub Actions compiles and runs the three content validators plus the SEO, structured-data, and media-inventory reproducibility checks on pull requests and pushes to `main` or `agent/**`.',
                  'GitHub Actions compiles and runs seven permanent checks: the three content validators, SEO, structured data, media inventory, and PDF accessibility release validation on pull requests and pushes to `main` or `agent/**`.'
              ),
              (
                  '## Deployment\n',
                  '''## PDF Accessibility Baseline\n\n`data/pdf-accessibility-audit.json` records the July 11, 2026 baseline for all 44 supplied companion interiors. The audit found no usable extractable text in the source PDFs, so every source file remains blocked from accessible digital distribution until remediation is manually verified.\n\n`scripts/validate_pdf_accessibility.py` checks source IDs, filenames, page counts, SHA-256 values, remediation states, approval requirements, and public PDF links. A record cannot be approved unless text, semantic tags, reading order, meaningful alternatives, language metadata, and manual QA are verified.\n\nSee `docs/pdf-accessibility-remediation.md` for the required workflow and `docs/pdf-accessibility-review-log-template.md` for the manual QA record.\n\n## Deployment\n'''
              ),
              (
                  '- The generated SEO, sitemap, structured-data, and media-inventory consistency checks\n',
                  '- The generated SEO, sitemap, structured-data, media-inventory, and PDF-accessibility consistency checks\n'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected README text not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          readme.write_text(text, encoding='utf-8')

          inventory = Path('docs/source-catalog-inventory.md')
          text = inventory.read_text(encoding='utf-8')
          old = 'A source PDF existing does not automatically mean that the title is publication-ready. The manifest records a separate quality status for every interior.\n'
          new = '''A source PDF existing does not automatically mean that the title is publication-ready. The manifest records a separate quality status for every interior.\n\nThe July 11, 2026 accessibility baseline found no usable extractable text in the 44 supplied PDFs. The exact source hashes are mirrored in `data/pdf-accessibility-audit.json`, and every source file remains blocked from accessible digital distribution until a remediated edition passes manual verification.\n'''
          if old not in text:
              raise SystemExit('Expected source-inventory accessibility insertion point not found')
          text = text.replace(old, new, 1)

          old = '`validate_source_manifest.py` reconciles the structured catalog, static `data-source-id` entries, and the checksum-backed source manifest before deployment.\n'
          new = '''`validate_source_manifest.py` reconciles the structured catalog, static `data-source-id` entries, and the checksum-backed source manifest before deployment.\n\n`validate_pdf_accessibility.py` reconciles the accessibility registry with the same source IDs, filenames, page counts, and hashes. It also blocks unapproved PDF links and prevents a record from being marked accessible without verified text, tags, reading order, meaningful alternatives, language metadata, and manual QA.\n'''
          if old not in text:
              raise SystemExit('Expected source-inventory validator paragraph not found')
          text = text.replace(old, new, 1)
          inventory.write_text(text, encoding='utf-8')

      - name: Commit documentation changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/source-catalog-inventory.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: document PDF accessibility release gate"
          git push origin HEAD:agent/site-hardening-and-catalog-fixes
