name: One-time SEO Update

on:
  push:
    branches:
      - "agent/site-hardening-and-catalog-fixes"

permissions:
  contents: write

jobs:
  update-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/site-hardening-and-catalog-fixes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate canonical and social metadata
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_seo.py
          python scripts/update_seo.py --write

      - name: Commit generated SEO files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' robots.txt sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "feat: apply canonical metadata and generate sitemap"
          git push origin HEAD:agent/site-hardening-and-catalog-fixes
