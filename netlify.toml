[build]
  publish = "."
  command = "python3 scripts/validate_site.py && python3 scripts/validate_source_manifest.py && python3 scripts/validate_marketplace.py && python3 scripts/update_seo.py --check && python3 scripts/update_structured_data.py --check && python3 scripts/update_media_inventory.py --check"

[[redirects]]
  from = "/lulu-and-ellie.html"
  to = "/lulu-ellie/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, must-revalidate"
